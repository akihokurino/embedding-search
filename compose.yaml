version: '3'
services:
  app:
    build: .
    container_name: app
    environment:
      DB_HOST: db
    ports:
      - '3000:8080'
    volumes:
      - .:/app
    working_dir: /app
    command:
      - "sh"
      - "-c"
      - "python -m api"
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: embedding_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: